name: Output markdown
on: pull_request

jobs:
  output_markdown:
    name: Output markdown
    runs-on: ubuntu-latest
    steps:
      - name: create markdown
        shell: bash
        run: |
          echo "* :rotating_light: - Major version upgrade" >> output.md

      - uses: actions/upload-artifact@v4
        with:
          name: output.md
          path: output.md

    
